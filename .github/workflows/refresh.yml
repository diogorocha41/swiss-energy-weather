name: Daily data refresh

on:
  schedule:
    - cron: "40 5 * * *"   # every day 05:40 UTC (MeteoSwiss 'recent' files update ~01-02 UTC)
  workflow_dispatch:        # manual "Run workflow" button
  push:
    paths:
      - "data/processed/**"
      - "sql/**"
      - "src/**"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache MeteoSwiss raw files
        uses: actions/cache@v4
        with:
          path: data/raw/meteoswiss
          key: meteo-${{ github.run_id }}
          restore-keys: meteo-

      - name: Unit tests
        run: pytest -q

      - name: Run pipeline
        run: python -m src.pipeline all

      - name: Commit updated marts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marts/*.parquet
          git diff --cached --quiet || git commit -m "data: refresh marts $(date -u +%F)"
          git push
