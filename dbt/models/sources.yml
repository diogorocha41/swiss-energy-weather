version: 2

sources:
  - name: raw
    description: Tables loaded by the Python ingestion layer (src/ingest_*.py, src/transform.py).
    schema: main
    tables:
      - name: raw_swissgrid
        description: Swissgrid 15-minute energy data, long format, UTC, kWh.
        columns:
          - name: ts_utc_end
            description: End of the 15-minute interval (UTC).
            tests: [not_null]
          - name: series
            tests:
              - accepted_values:
                  arguments:
                    values: [end_consumption, total_consumption, production, net_outflow, grid_feed_in]
      - name: raw_meteo_hourly
        description: MeteoSwiss SwissMetNet hourly station data (UTC, interval end).
        columns:
          - name: station
            tests: [not_null]
      - name: dim_station
        description: Weather stations and their weights for the national average (from config.py).
        columns:
          - name: station
            tests: [unique, not_null]
      - name: dim_holiday
        description: Public holidays for CH and PT (computed in src/calendar_ch.py).
        columns:
          - name: country
            tests:
              - accepted_values:
                  arguments:
                    values: [CH, PT]
          - name: holiday_date
            tests: [not_null]
      - name: raw_eredes
        description: E-REDES mainland Portugal consumption, 15-minute, kWh per voltage level, UTC (interval end).
        columns:
          - name: ts_utc_end
            tests: [unique, not_null]
      - name: raw_openmeteo_hourly
        description: ERA5 hourly temperature (Open-Meteo) for Swiss and Portuguese cities, UTC.
        columns:
          - name: country
            tests:
              - accepted_values:
                  arguments:
                    values: [CH, PT]
      - name: dim_city
        description: Cities used for the comparison temperature and their weights (from config.py).
      - name: dim_country
        description: Population per country used for per-capita figures (from config.py).
        columns:
          - name: country
            tests: [unique, not_null]
